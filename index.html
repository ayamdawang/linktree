<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayam & Bebek Bakar Dawang</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 680px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 48px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            margin: 0 auto 24px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(211, 47, 47, 0.3);
            border: 6px solid #d32f2f;
            background: #ffffff;
        }

        .profile-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .subtitle {
            font-size: 14px;
            font-weight: 600;
            color: #d32f2f;
            letter-spacing: 2.5px;
            margin-bottom: 8px;
        }

        .title {
            font-size: 42px;
            font-weight: 700;
            color: #d32f2f;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .social-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #d32f2f;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            background: #b71c1c;
            transform: scale(1.1);
        }

        .links {
            margin-top: 36px;
        }

        .link-button {
            display: block;
            background: #d32f2f;
            color: #ffffff;
            text-decoration: none;
            padding: 18px 28px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-weight: 600;
            font-size: 15px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.2);
        }

        .link-button:hover {
            background: #b71c1c;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(211, 47, 47, 0.35);
        }

        .link-button:active {
            transform: translateY(0);
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 32px;
            border-top: 1px solid #e0e0e0;
            font-size: 13px;
            color: #777;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            .container {
                padding: 36px 24px;
            }

            .profile-img {
                width: 130px;
                height: 130px;
            }

            .title {
                font-size: 34px;
            }

            .social-icon {
                width: 38px;
                height: 38px;
                font-size: 18px;
            }

            .link-button {
                padding: 16px 24px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="profile-img">
                <img src="logodawang.png" alt="Ayam & Bebek Bakar Dawang">
            </div>
            <div class="subtitle">AYAM & BEBEK BAKAR</div>
            <h1 class="title">DAWANG</h1>
            <div class="social-icons">
                <div class="social-icon">📞</div>
                <div class="social-icon">📷</div>
                <div class="social-icon">📍</div>
            </div>
        </div>

        <div class="links">
            <a href="https://wa.me/6281155511300" class="link-button" target="_blank">
                Pesan via WhatsApp
            </a>
            <a href="https://drive.google.com/file/d/1Jd7V0fydZ8UjKGV5_9TvXmOBP15L6zS-/view" class="link-button" target="_blank">
                Lihat Menu Lengkap
            </a>
            <a href="https://gofood.link/a/F92EWLC" class="link-button" target="_blank">
                Order di GoFood
            </a>
            <a href="https://r.grab.com/g/2-1-6-C3T2JNE2GETBGJ" class="link-button" target="_blank">
                Order di GrabFood
            </a>
            <a href="https://maps.app.goo.gl/bHGNCvzvrExYMQLQ7" class="link-button" target="_blank">
                Lokasi Rumah Makan<br>
                <small style="font-size: 13px; font-weight: 400; opacity: 0.9;">Jl. KH. Samanhudi No. 275</small>
            </a>
            <a href="https://www.instagram.com/dawangsamarinda/" class="link-button" target="_blank">
                Instagram Resmi<br>
                <small style="font-size: 13px; font-weight: 400; opacity: 0.9;">@dawangsamarinda</small>
            </a>
        </div>

        <div class="footer">
            Melayani makan di tempat, reservasi dan pemesanan online.<br>
            Kualitas rasa dijaga setiap hari.
        </div>
    </div>
</body>
</html>
